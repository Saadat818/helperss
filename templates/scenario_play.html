<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ scenario.title }} — Helper</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a1e2e;
            --muted: #6b7280;
            --border: #e2e8f0;
            --green: #059669;
            --green-light: #d1fae5;
            --blue: #2563eb;
            --blue-light: #dbeafe;
            --yellow: #d97706;
            --yellow-light: #fef3c7;
            --red: #dc2626;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
            --shadow-lg: 0 4px 6px rgba(0,0,0,.07), 0 10px 40px rgba(0,0,0,.1);
        }
        body.dark {
            --bg: #0f1117;
            --card: #1a1d27;
            --text: #e8e8f0;
            --muted: #8888aa;
            --border: #2a2d3e;
            --green-light: rgba(5,150,105,.15);
            --blue-light: rgba(37,99,235,.15);
            --yellow-light: rgba(217,119,6,.15);
            --shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
            --shadow-lg: 0 4px 6px rgba(0,0,0,.3), 0 10px 40px rgba(0,0,0,.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, Arial;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .2s, color .2s;
        }

        /* ── Header ── */
        .header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--muted); text-decoration: none;
            font-size: 14px; padding: 6px 12px;
            border-radius: 8px; border: 1px solid var(--border);
            transition: all .15s; white-space: nowrap;
        }
        .back-btn:hover { color: var(--text); border-color: var(--blue); }
        .header-title {
            font-size: 16px; font-weight: 700;
            color: var(--text); flex: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .step-badge {
            font-size: 12px; font-weight: 600; color: var(--muted);
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 20px; padding: 4px 12px; white-space: nowrap;
        }
        .theme-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--bg); border: 1px solid var(--border);
            font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .theme-btn:hover { border-color: var(--blue); }

        /* ── Main layout ── */
        .main {
            max-width: 680px;
            margin: 0 auto;
            padding: 32px 16px 80px;
        }

        /* ── Path chips ── */
        .path-chips {
            display: flex; flex-wrap: wrap; gap: 6px;
            margin-bottom: 24px; min-height: 28px;
        }
        .chip {
            display: inline-flex; align-items: center; gap: 4px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 4px 10px;
            font-size: 12px; color: var(--muted);
            cursor: pointer; transition: all .15s;
            max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .chip:hover { border-color: var(--blue); color: var(--blue); }
        .chip.answer {
            background: var(--blue-light);
            border-color: transparent;
            color: var(--blue);
            font-weight: 600;
        }
        .chip-sep { color: var(--muted); font-size: 12px; align-self: center; }

        /* ── Question card ── */
        .question-card {
            background: var(--card);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-lg);
            animation: slideUp .2s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .node-label {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .6px; margin-bottom: 14px;
            padding: 4px 10px; border-radius: 20px;
        }
        .label-question { background: var(--blue-light); color: var(--blue); }
        .label-info     { background: var(--yellow-light); color: var(--yellow); }
        .label-start    { background: var(--green-light); color: var(--green); }

        .question-title {
            font-size: 22px; font-weight: 700;
            line-height: 1.35; color: var(--text);
            margin-bottom: 10px;
        }
        .question-hint {
            font-size: 14px; color: var(--muted);
            line-height: 1.6; margin-bottom: 28px;
            padding: 12px 14px;
            background: var(--bg);
            border-radius: 8px;
            border-left: 3px solid var(--border);
        }

        /* ── Answer buttons ── */
        .answers {
            display: flex; flex-direction: column; gap: 10px;
        }
        .answer-btn {
            width: 100%; padding: 16px 20px;
            background: var(--bg); border: 2px solid var(--border);
            border-radius: 12px; font-size: 15px; font-weight: 600;
            color: var(--text); cursor: pointer; text-align: left;
            display: flex; align-items: center; justify-content: space-between;
            transition: all .15s;
        }
        .answer-btn:hover {
            border-color: var(--blue);
            background: var(--blue-light);
            color: var(--blue);
            transform: translateX(3px);
        }
        .answer-btn:active { transform: translateX(1px); }
        .answer-arrow { font-size: 18px; opacity: .5; flex-shrink: 0; }
        .answer-btn:hover .answer-arrow { opacity: 1; }

        /* ── Info node (без кнопок, просто «Далее») ── */
        .continue-btn {
            width: 100%; padding: 16px;
            background: var(--blue); color: #fff;
            border: none; border-radius: 12px;
            font-size: 15px; font-weight: 700;
            cursor: pointer; margin-top: 8px;
            transition: opacity .15s;
        }
        .continue-btn:hover { opacity: .88; }

        /* ── Final card ── */
        .final-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            animation: slideUp .2s ease;
        }
        .final-header {
            background: linear-gradient(135deg, #059669, #047857);
            padding: 24px 28px;
            color: #fff;
        }
        .final-header-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .8px; opacity: .8; margin-bottom: 8px;
        }
        .final-header-title {
            font-size: 20px; font-weight: 700; line-height: 1.3;
        }

        .final-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }

        .final-block {}
        .final-block-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .5px; color: var(--muted); margin-bottom: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .final-block-content {
            font-size: 15px; line-height: 1.65; color: var(--text);
        }

        /* Блок «Что сказать клиенту» */
        .answer-block {
            background: var(--green-light);
            border-radius: 12px;
            padding: 16px 18px;
            position: relative;
        }
        .answer-block .final-block-label { color: var(--green); }
        .answer-block .final-block-content {
            font-size: 15px; line-height: 1.7; color: var(--text);
            white-space: pre-wrap;
        }
        .copy-inline-btn {
            position: absolute; top: 12px; right: 12px;
            padding: 5px 10px; font-size: 12px; font-weight: 600;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 6px; cursor: pointer; color: var(--muted);
            transition: all .15s;
        }
        .copy-inline-btn:hover { border-color: var(--green); color: var(--green); }
        .copy-inline-btn.copied { border-color: var(--green); color: var(--green); background: var(--green-light); }

        /* Документы */
        .doc-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .doc-item {
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; color: var(--text);
        }
        .doc-item::before { content: '📎'; font-size: 14px; }

        /* Ссылки */
        .link-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .link-item a {
            color: var(--blue); text-decoration: none; font-size: 14px;
            display: flex; align-items: center; gap: 6px;
        }
        .link-item a:hover { text-decoration: underline; }
        .link-item a::before { content: '🔗'; font-size: 13px; }

        /* Внутренняя заметка */
        .note-block {
            background: var(--yellow-light);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .note-block .final-block-label { color: var(--yellow); }
        .note-block .final-block-content { font-size: 14px; color: var(--text); }

        /* Разделитель */
        .final-divider { height: 1px; background: var(--border); margin: 4px 0; }

        /* ── Bottom actions ── */
        .bottom-actions {
            display: flex; gap: 10px; flex-wrap: wrap;
            margin-top: 24px; align-items: center;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 18px; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            border: none; transition: all .15s; text-decoration: none;
        }
        .btn:hover { opacity: .85; }
        .btn-back {
            background: var(--card); color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-back:hover { border-color: var(--blue); color: var(--blue); }
        .btn-restart {
            background: var(--card); color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-restart:hover { border-color: var(--red); color: var(--red); }
        .btn-list {
            background: var(--card); color: var(--muted);
            border: 1px solid var(--border);
            text-decoration: none;
        }
        .btn-list:hover { border-color: var(--blue); color: var(--blue); }
        .btn-copy {
            background: var(--green); color: #fff;
        }
        .btn-copy.copied { background: #047857; }
        .btn-ml { margin-left: auto; }

        /* ── Empty / error state ── */
        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--muted);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state h2 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        .empty-state p { font-size: 14px; line-height: 1.6; }

        /* ── Loading ── */
        .loading {
            display: flex; align-items: center; justify-content: center;
            padding: 60px; color: var(--muted); gap: 10px; font-size: 14px;
        }
        .spinner {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid var(--border);
            border-top-color: var(--blue);
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Restart modal ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.5); z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--card); border-radius: 14px;
            padding: 28px; max-width: 340px; width: 90%;
            box-shadow: var(--shadow-lg);
        }
        .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
        .modal p { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .main { padding: 20px 12px 60px; }
            .question-card, .final-body { padding: 20px 16px; }
            .final-header { padding: 18px 20px; }
            .question-title { font-size: 18px; }
            .header-title { font-size: 14px; }
            .step-badge { display: none; }
            .bottom-actions { flex-direction: column; }
            .bottom-actions .btn { width: 100%; justify-content: center; }
            .btn-ml { margin-left: 0; }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>

<!-- Header -->
<div class="header">
    <a href="{{ url_for('scenarios_list') }}" class="back-btn">← Сценарии</a>
    <div class="header-title">{{ scenario.title }}</div>
    <div class="header-right">
        <div class="step-badge" id="stepBadge">Шаг 1</div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>
</div>

<!-- Main -->
<div class="main">
    <!-- Путь (chips) -->
    <div class="path-chips" id="pathChips"></div>

    <!-- Контент (вопрос / финал / загрузка) -->
    <div id="content">
        <div class="loading"><div class="spinner"></div> Загрузка...</div>
    </div>

    <!-- Нижние кнопки -->
    <div class="bottom-actions" id="bottomActions" style="display:none;"></div>
</div>

<!-- Restart modal -->
<div class="modal-overlay" id="restartModal">
    <div class="modal">
        <h3>Начать заново?</h3>
        <p>Текущий прогресс будет сброшен и вы начнёте сценарий с начала.</p>
        <div class="modal-btns">
            <button class="btn btn-back" onclick="closeRestartModal()">Отмена</button>
            <button class="btn btn-restart" onclick="confirmRestart()">Начать заново</button>
        </div>
    </div>
</div>

<script>
const SCENARIO_ID = {{ scenario.id }};
const ROOT_NODE_ID = {{ root_node.id if root_node else 'null' }};
const SCENARIO_TITLE = {{ scenario.title | tojson }};

// История: [{nodeId, title, answerLabel}]
let history = [];
let currentNodeId = null;
let stepCount = 0;

// ── Загрузка узла ─────────────────────────────────────────────────
async function loadNode(nodeId, pushToHistory = true, answerLabel = '') {
    showLoading();
    try {
        const resp = await fetch(`/api/scenarios/${SCENARIO_ID}/node/${nodeId}`);
        const data = await resp.json();
        if (!data.success) { showError(data.error || 'Ошибка загрузки'); return; }

        const node = data.node;
        const choices = data.choices || [];

        if (pushToHistory && currentNodeId !== null) {
            history.push({ nodeId: currentNodeId, title: node.title, answerLabel });
        }

        currentNodeId = nodeId;
        stepCount = history.length + 1;

        updateBadge();
        updatePath();
        renderNode(node, choices);
        renderBottomActions(node);

    } catch(e) {
        showError('Не удалось загрузить шаг. Проверьте соединение.');
    }
}

// ── Рендер узла ───────────────────────────────────────────────────
function renderNode(node, choices) {
    const content = document.getElementById('content');
    const type = node.node_type;

    if (type === 'final') {
        content.innerHTML = renderFinal(node);
    } else {
        content.innerHTML = renderQuestion(node, choices);
    }

    // Анимация появления
    content.firstElementChild?.classList.add('animate');
}

function renderQuestion(node, choices) {
    const labelMap = {
        start: ['🚀', 'Начало', 'label-start'],
        question: ['❓', 'Вопрос', 'label-question'],
        info: ['ℹ️', 'Действие', 'label-info'],
    };
    const [icon, labelText, labelClass] = labelMap[node.node_type] || ['❓', 'Вопрос', 'label-question'];

    const hintHtml = node.content
        ? `<div class="question-hint">${esc(node.content)}</div>`
        : '';

    let answersHtml = '';
    if (node.node_type === 'info' && choices.length === 1) {
        // Info-узел с одним переходом — просто кнопка Далее
        answersHtml = `
            <button class="continue-btn"
                data-nid="${choices[0].to_node_id}"
                data-lbl="">
                Далее →
            </button>`;
    } else if (choices.length > 0) {
        answersHtml = `<div class="answers">` +
            choices.map(c => `
                <button class="answer-btn"
                    data-nid="${c.to_node_id}"
                    data-lbl="${esc(c.label || '')}">
                    <span>${esc(c.label || 'Далее')}</span>
                    <span class="answer-arrow">›</span>
                </button>
            `).join('') +
        `</div>`;
    } else {
        answersHtml = `<div style="color:var(--muted);font-size:14px;text-align:center;padding:20px 0;">
            Дальнейших шагов нет
        </div>`;
    }

    return `
    <div class="question-card">
        <div class="node-label ${labelClass}">${icon} ${labelText}</div>
        <div class="question-title">${esc(node.title || '')}</div>
        ${hintHtml}
        ${answersHtml}
    </div>`;
}

function renderFinal(node) {
    let blocks = '';

    // Блок: готовый ответ клиенту
    if (node.final_answer) {
        blocks += `
        <div class="final-block answer-block">
            <div class="final-block-label">💬 Что сказать клиенту</div>
            <div class="final-block-content" id="finalAnswerText">${esc(node.final_answer)}</div>
            <button class="copy-inline-btn" id="copyInlineBtn" onclick="copyAnswer()">📋 Копировать</button>
        </div>`;
    }

    // Блок: контент / что нужно сделать
    if (node.content) {
        blocks += `
        <div class="final-block">
            <div class="final-block-label">📋 Что нужно сделать</div>
            <div class="final-block-content">${esc(node.content)}</div>
        </div>`;
    }

    // Документы
    if (node.documents) {
        const docs = node.documents.split('\n').map(d => d.trim()).filter(Boolean);
        if (docs.length) {
            blocks += `
            <div class="final-block">
                <div class="final-block-label">📎 Документы / условия</div>
                <ul class="doc-list">
                    ${docs.map(d => `<li class="doc-item">${esc(d)}</li>`).join('')}
                </ul>
            </div>`;
        }
    }

    // Ссылки
    if (node.links) {
        const links = node.links.split('\n').map(l => l.trim()).filter(Boolean);
        if (links.length) {
            blocks += `
            <div class="final-block">
                <div class="final-block-label">🔗 Ссылки</div>
                <ul class="link-list">
                    ${links.map(l => {
                        const isUrl = l.startsWith('http');
                        return `<li class="link-item">${isUrl
                            ? `<a href="${esc(l)}" target="_blank">${esc(l)}</a>`
                            : `<span style="font-size:14px;color:var(--text);">${esc(l)}</span>`
                        }</li>`;
                    }).join('')}
                </ul>
            </div>`;
        }
    }

    // Внутренняя заметка
    if (node.internal_note) {
        blocks += `
        <div class="final-block note-block">
            <div class="final-block-label">🔒 Внутренняя заметка</div>
            <div class="final-block-content">${esc(node.internal_note)}</div>
        </div>`;
    }

    if (!blocks) {
        blocks = `<div style="color:var(--muted);font-size:14px;text-align:center;padding:20px 0;">
            Информация по данному шагу не заполнена
        </div>`;
    }

    return `
    <div class="final-card">
        <div class="final-header">
            <div class="final-header-label">✅ Финальный ответ</div>
            <div class="final-header-title">${esc(node.title || 'Результат')}</div>
        </div>
        <div class="final-body">${blocks}</div>
    </div>`;
}

// ── Нижние кнопки ─────────────────────────────────────────────────
function renderBottomActions(node) {
    const ba = document.getElementById('bottomActions');
    ba.style.display = 'flex';
    const isFinal = node.node_type === 'final';
    const canGoBack = history.length > 0;

    let html = '';

    if (canGoBack) {
        html += `<button class="btn btn-back" onclick="goBack()">← Назад</button>`;
    }

    html += `<button class="btn btn-restart" onclick="showRestartModal()">↺ Начать заново</button>`;

    if (isFinal) {
        if (node.final_answer) {
            html += `<button class="btn btn-copy btn-ml" id="copyMainBtn" onclick="copyAnswer()">📋 Скопировать ответ</button>`;
        }
        html += `<a href="{{ url_for('scenarios_list') }}" class="btn btn-list ${node.final_answer ? '' : 'btn-ml'}">К списку</a>`;
    }

    ba.innerHTML = html;
}

// ── Навигация ─────────────────────────────────────────────────────
function selectAnswer(toNodeId, label) {
    loadNode(toNodeId, true, label);
}

// Делегирование кликов по кнопкам ответов (data-nid / data-lbl)
// Вешаем на document чтобы работало после innerHTML перезаписи
document.addEventListener('click', function(e) {
    const btn = e.target.closest('[data-nid]');
    if (!btn) return;
    const nid = parseInt(btn.dataset.nid);
    const lbl = btn.dataset.lbl || '';
    if (nid) loadNode(nid, true, lbl);
});

function goBack() {
    if (!history.length) return;
    const prev = history.pop();
    loadNode(prev.nodeId, false);
}

function showRestartModal() {
    document.getElementById('restartModal').classList.add('show');
}
function closeRestartModal() {
    document.getElementById('restartModal').classList.remove('show');
}
function confirmRestart() {
    closeRestartModal();
    history = [];
    stepCount = 0;
    loadNode(ROOT_NODE_ID, false);
}

// ── Path chips ────────────────────────────────────────────────────
function updatePath() {
    const chips = document.getElementById('pathChips');
    if (!history.length) { chips.innerHTML = ''; return; }

    // Показываем только ответы (answerLabel) — то что выбрал оператор
    const answers = history.filter(h => h.answerLabel).slice(-5); // последние 5
    if (!answers.length) { chips.innerHTML = ''; return; }

    chips.innerHTML = answers.map((h, i) => `
        ${i > 0 ? '<span class="chip-sep">›</span>' : ''}
        <span class="chip answer">${esc(h.answerLabel)}</span>
    `).join('');
}

// ── Step badge ────────────────────────────────────────────────────
function updateBadge() {
    const badge = document.getElementById('stepBadge');
    badge.textContent = `Шаг ${stepCount}`;
}

// ── Копирование ───────────────────────────────────────────────────
function copyAnswer() {
    const el = document.getElementById('finalAnswerText');
    if (!el) return;
    const text = el.innerText;
    navigator.clipboard.writeText(text).then(() => {
        // Inline btn
        const inlineBtn = document.getElementById('copyInlineBtn');
        if (inlineBtn) { inlineBtn.textContent = '✓ Скопировано'; inlineBtn.classList.add('copied'); }
        // Main btn
        const mainBtn = document.getElementById('copyMainBtn');
        if (mainBtn) { mainBtn.textContent = '✓ Скопировано'; mainBtn.classList.add('copied'); }
        setTimeout(() => {
            if (inlineBtn) { inlineBtn.textContent = '📋 Копировать'; inlineBtn.classList.remove('copied'); }
            if (mainBtn) { mainBtn.textContent = '📋 Скопировать ответ'; mainBtn.classList.remove('copied'); }
        }, 2500);
    }).catch(() => {
        // Fallback
        const range = document.createRange();
        range.selectNode(el);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
    });
}

// ── Утилиты ───────────────────────────────────────────────────────
function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function showLoading() {
    document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка...</div>';
    document.getElementById('bottomActions').style.display = 'none';
    document.getElementById('pathChips').innerHTML = '';
}
function showError(msg) {
    document.getElementById('content').innerHTML = `
    <div class="empty-state">
        <div class="icon">⚠️</div>
        <h2>Что-то пошло не так</h2>
        <p>${esc(msg)}</p>
        <a href="{{ url_for('scenarios_list') }}" class="btn btn-list" style="display:inline-flex;margin-top:16px;">← К списку сценариев</a>
    </div>`;
    document.getElementById('bottomActions').style.display = 'none';
}

// ── Тема ──────────────────────────────────────────────────────────
function toggleTheme() {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
}

// ── Инициализация ─────────────────────────────────────────────────
(function init() {
    // Тема
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeBtn').textContent = '☀️';
    }

    if (!ROOT_NODE_ID) {
        showError('Сценарий не настроен — стартовый узел не найден.');
        return;
    }
    loadNode(ROOT_NODE_ID, false);
})();
</script>
