<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ scenario.title }} — Helper</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --panel: #ffffff;
            --panel-soft: #f9fbfd;
            --text: #172033;
            --muted: #667085;
            --line: #e3e9f2;
            --green: #12a66a;
            --green-dark: #0b8756;
            --green-soft: #e8f7ef;
            --blue: #2563eb;
            --blue-soft: #eaf2ff;
            --amber: #f59f00;
            --amber-soft: #fff5dc;
            --red: #e5485d;
            --red-soft: #ffecef;
            --shadow: 0 16px 40px rgba(28, 39, 60, .08);
            --radius: 18px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 0%, rgba(18,166,106,.08), transparent 30%),
                linear-gradient(180deg, #fbfdff 0%, var(--bg) 48%, #f2f5f9 100%);
            color: var(--text);
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }

        .page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 24px 38px;
        }
        .topbar {
            display: grid;
            grid-template-columns: 190px minmax(0, 1fr) 170px;
            gap: 18px;
            align-items: center;
            margin-bottom: 18px;
        }
        .back-link,
        .restart-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            min-height: 38px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: #fff;
            color: var(--blue);
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }
        .restart-btn {
            justify-self: end;
            color: var(--blue);
        }
        .scenario-title {
            min-width: 0;
            text-align: center;
            font-size: 17px;
            font-weight: 850;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-wrap {
            max-width: 360px;
            margin: -6px auto 20px;
            text-align: center;
        }
        .step-text {
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 750;
        }
        .progress {
            height: 6px;
            overflow: hidden;
            border-radius: 999px;
            background: #dce5ef;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--green), #28c987);
            transition: width .18s ease;
        }

        .workspace {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }
        .path-panel,
        .content-card {
            background: rgba(255,255,255,.96);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .path-panel {
            position: sticky;
            top: 18px;
            padding: 16px;
            min-height: 260px;
        }
        .path-title {
            margin: 0 0 14px;
            color: var(--text);
            font-size: 14px;
            font-weight: 850;
        }
        .path-list {
            display: grid;
            gap: 10px;
        }
        .path-empty {
            padding: 14px;
            border: 1px dashed #cfd8e5;
            border-radius: 12px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }
        .path-item {
            position: relative;
            display: grid;
            grid-template-columns: 18px minmax(0, 1fr);
            gap: 9px;
            align-items: start;
        }
        .path-item:not(:last-child)::after {
            content: "";
            position: absolute;
            left: 8px;
            top: 20px;
            bottom: -10px;
            width: 1px;
            background: #d9e2ee;
        }
        .path-dot {
            position: relative;
            z-index: 1;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid #aeb9c8;
            background: #fff;
        }
        .path-question {
            margin-bottom: 4px;
            color: #344054;
            font-size: 12px;
            line-height: 1.35;
        }
        .path-answer {
            width: fit-content;
            max-width: 100%;
            padding: 5px 9px;
            border-radius: 9px;
            background: var(--green-soft);
            color: var(--green-dark);
            font-size: 12px;
            font-weight: 850;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .content-card {
            min-height: 470px;
            overflow: hidden;
        }
        .card-inner {
            padding: 26px 30px;
        }
        .node-badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .03em;
        }
        .badge-question { background: var(--blue-soft); color: var(--blue); }
        .badge-info { background: var(--amber-soft); color: #a15d00; }
        .badge-final { background: var(--green-soft); color: var(--green-dark); }
        .badge-start { background: var(--green-soft); color: var(--green-dark); }

        .node-title {
            margin: 0 0 10px;
            font-size: 28px;
            line-height: 1.18;
            letter-spacing: -.04em;
        }
        .node-hint {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }
        .answers {
            display: grid;
            gap: 12px;
            margin-top: 22px;
        }
        .answer-btn,
        .primary-btn,
        .secondary-btn,
        .copy-btn {
            min-height: 50px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all .15s ease;
        }
        .answer-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 18px;
            border: 1px solid #cfd8e5;
            background: #fff;
            color: var(--text);
            text-align: left;
        }
        .answer-btn:hover {
            border-color: var(--blue);
            background: var(--blue-soft);
            color: var(--blue);
            transform: translateX(2px);
        }
        .instruction-list {
            margin: 18px 0 0;
            padding-left: 18px;
            color: #344054;
            font-size: 15px;
            line-height: 1.75;
        }
        .hint-box {
            margin-top: 24px;
            padding: 16px;
            border: 1px solid #ffd58a;
            border-radius: 14px;
            background: var(--amber-soft);
            color: #5d4200;
            font-size: 14px;
            line-height: 1.55;
        }

        .final-header {
            padding: 24px 30px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #fbfffd, #f3fbf7);
        }
        .final-title {
            margin: 10px 0 0;
            font-size: 26px;
            letter-spacing: -.04em;
        }
        .final-body {
            display: grid;
            gap: 16px;
            padding: 22px 30px 26px;
        }
        .final-block {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
            padding: 16px;
        }
        .answer-block {
            border-color: #bdebd2;
            background: linear-gradient(180deg, #f0fbf5, #e9f8f0);
        }
        .block-label {
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .block-content {
            color: var(--text);
            font-size: 15px;
            line-height: 1.65;
            white-space: pre-wrap;
        }
        .note-block {
            background: #fcfdff;
        }
        .note-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .lock {
            color: var(--muted);
            font-size: 13px;
        }
        .materials {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .materials a,
        .materials span {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--blue);
            font-size: 14px;
            font-weight: 750;
        }
        .materials span {
            color: var(--text);
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 30px;
            border-top: 1px solid var(--line);
            background: #fbfdff;
        }
        .primary-btn,
        .copy-btn {
            border: none;
            background: var(--blue);
            color: #fff;
            padding: 0 20px;
        }
        .primary-btn.green {
            background: var(--green);
        }
        .secondary-btn {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--blue);
            padding: 0 16px;
        }
        .copy-btn {
            min-height: 42px;
            background: #fff;
            color: var(--blue);
            border: 1px solid #bcd0f8;
            margin-top: 14px;
        }
        .copy-btn.copied {
            border-color: var(--green);
            color: var(--green-dark);
            background: var(--green-soft);
        }

        .loading,
        .empty {
            display: grid;
            place-items: center;
            min-height: 430px;
            padding: 30px;
            color: var(--muted);
            text-align: center;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid #dce5ef;
            border-top-color: var(--green);
            animation: spin .75s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(15,23,42,.42);
        }
        .modal-overlay.show { display: flex; }
        .modal {
            width: min(380px, 100%);
            padding: 24px;
            border-radius: 18px;
            background: #fff;
            box-shadow: var(--shadow);
        }
        .modal h3 { margin: 0 0 8px; }
        .modal p { margin: 0 0 18px; color: var(--muted); line-height: 1.55; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

        @media (max-width: 860px) {
            .page { padding: 18px 14px 30px; }
            .topbar { grid-template-columns: 1fr; }
            .scenario-title { text-align: left; }
            .restart-btn { justify-self: start; }
            .workspace { grid-template-columns: 1fr; }
            .path-panel { position: static; }
            .node-title { font-size: 23px; }
            .card-inner,
            .final-header,
            .final-body,
            .footer-actions { padding-left: 18px; padding-right: 18px; }
            .footer-actions { flex-direction: column; }
            .footer-actions > * { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="page">
    <header class="topbar">
        <a href="{{ url_for('scenarios_list') }}" class="back-link">← К списку сценариев</a>
        <div class="scenario-title">{{ scenario.title }}</div>
        <button class="restart-btn" type="button" onclick="showRestartModal()">↻ Начать заново</button>
    </header>

    <div class="progress-wrap">
        <div class="step-text" id="stepText">Шаг 1 из {{ total_nodes or 1 }}</div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <main class="workspace">
        <aside class="path-panel">
            <h2 class="path-title">История пути</h2>
            <div class="path-list" id="pathList">
                <div class="path-empty">Ответы появятся здесь после выбора вариантов в сценарии.</div>
            </div>
        </aside>

        <section class="content-card" id="content">
            <div class="loading"><div><div class="spinner"></div>Загрузка сценария...</div></div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="restartModal">
    <div class="modal">
        <h3>Начать сценарий заново?</h3>
        <p>История выбранных ответов очистится, и вы вернётесь к первому шагу.</p>
        <div class="modal-actions">
            <button class="secondary-btn" type="button" onclick="closeRestartModal()">Отмена</button>
            <button class="primary-btn green" type="button" onclick="confirmRestart()">Начать заново</button>
        </div>
    </div>
</div>

<script>
const SCENARIO_ID = {{ scenario.id }};
const ROOT_NODE_ID = {{ root_node.id if root_node else 'null' }};
const TOTAL_NODES = Math.max(1, {{ total_nodes or 1 }});

let history = [];
let currentNode = null;
let currentChoices = [];

function esc(value) {
    return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

async function loadNode(nodeId) {
    showLoading();
    try {
        const resp = await fetch(`/api/scenarios/${SCENARIO_ID}/node/${nodeId}`);
        const data = await resp.json();
        if (!data.success) {
            showError(data.error || 'Не удалось загрузить шаг');
            return;
        }
        currentNode = data.node;
        currentChoices = data.choices || [];
        renderCurrent();
    } catch (e) {
        showError('Не удалось загрузить шаг. Проверьте соединение.');
    }
}

function renderCurrent() {
    updateProgress();
    updatePath();
    if (!currentNode) return;

    if (currentNode.node_type === 'final') {
        renderFinal(currentNode);
    } else {
        renderStep(currentNode, currentChoices);
    }
}

function nodeKind(node) {
    if (node.node_type === 'final') return ['Финальный ответ', 'badge-final'];
    if (node.node_type === 'info') return ['Инструкция', 'badge-info'];
    if (node.node_type === 'start') return ['Начало', 'badge-start'];
    return ['Вопрос', 'badge-question'];
}

function renderStep(node, choices) {
    const [label, cls] = nodeKind(node);
    const isInstruction = node.node_type === 'info' || node.node_type === 'start';
    const hasSingleNext = isInstruction && choices.length === 1;
    const hint = node.content ? `<p class="node-hint">${esc(node.content)}</p>` : '';
    let body = '';

    if (isInstruction) {
        body = `
            ${hint || '<p class="node-hint">Выполните действие и переходите дальше.</p>'}
            ${node.content ? renderInstructionList(node.content) : ''}
            ${choices.length > 1 ? renderAnswers(choices) : ''}
        `;
    } else {
        body = `
            ${hint}
            ${choices.length ? renderAnswers(choices) : '<div class="hint-box">Для этого вопроса ещё не настроены варианты ответа.</div>'}
        `;
    }

    document.getElementById('content').innerHTML = `
        <div class="card-inner">
            <div class="node-badge ${cls}">${label}</div>
            <h1 class="node-title">${esc(node.title || 'Шаг сценария')}</h1>
            ${body}
        </div>
        <div class="footer-actions">
            <button class="secondary-btn" type="button" onclick="goBack()" ${history.length ? '' : 'disabled'}>← Назад</button>
            ${hasSingleNext ? `<button class="primary-btn scenario-next" type="button" data-nid="${choices[0].to_node_id}" data-label="${esc(choices[0].label || 'Далее')}">Далее</button>` : ''}
            ${!hasSingleNext ? `<a class="secondary-btn" href="{{ url_for('scenarios_list') }}">К списку сценариев</a>` : ''}
        </div>
    `;
}

function renderInstructionList(text) {
    const lines = String(text || '').split('\n').map(x => x.trim()).filter(Boolean);
    if (lines.length < 2) return '';
    return `<ol class="instruction-list">${lines.map(line => `<li>${esc(line)}</li>`).join('')}</ol>`;
}

function renderAnswers(choices) {
    return `<div class="answers">` + choices.map(choice => `
        <button class="answer-btn scenario-next" type="button" data-nid="${choice.to_node_id}" data-label="${esc(choice.label || 'Далее')}">
            <span>${esc(choice.label || 'Далее')}</span>
            <span>›</span>
        </button>
    `).join('') + `</div>`;
}

function renderFinal(node) {
    const finalAnswer = node.final_answer || '';
    const blocks = [];

    if (finalAnswer) {
        blocks.push(`
            <div class="final-block answer-block">
                <div class="block-label">Что сказать клиенту</div>
                <div class="block-content" id="finalAnswerText">${esc(finalAnswer)}</div>
                <button class="copy-btn" id="copyBtn" type="button" onclick="copyAnswer()">Скопировать ответ</button>
            </div>
        `);
    }

    if (node.content) {
        blocks.push(`
            <div class="final-block">
                <div class="block-label">Что нужно сделать</div>
                <div class="block-content">${esc(node.content)}</div>
            </div>
        `);
    }

    if (node.internal_note) {
        blocks.push(`
            <div class="final-block note-block">
                <div class="note-head">
                    <div class="block-label">Внутренняя заметка</div>
                    <div class="lock">только для оператора</div>
                </div>
                <div class="block-content">${esc(node.internal_note)}</div>
            </div>
        `);
    }

    const materials = renderMaterials(node);
    if (materials) blocks.push(materials);

    document.getElementById('content').innerHTML = `
        <div class="final-header">
            <div class="node-badge badge-final">Финальный ответ</div>
            <h1 class="final-title">${esc(node.title || 'Сообщите клиенту')}</h1>
        </div>
        <div class="final-body">
            ${blocks.length ? blocks.join('') : '<div class="final-block"><div class="block-content">Финальный шаг пока не заполнен.</div></div>'}
        </div>
        <div class="footer-actions">
            <button class="secondary-btn" type="button" onclick="goBack()" ${history.length ? '' : 'disabled'}>← Назад</button>
            <a class="secondary-btn" href="{{ url_for('scenarios_list') }}">К списку сценариев</a>
            <a class="primary-btn green" href="{{ url_for('scenarios_list') }}">Завершить</a>
        </div>
    `;
}

function renderMaterials(node) {
    const rows = [];
    if (node.documents) {
        String(node.documents).split('\n').map(x => x.trim()).filter(Boolean).forEach(doc => {
            rows.push(`<li><span>${esc(doc)}</span></li>`);
        });
    }
    if (node.links) {
        String(node.links).split('\n').map(x => x.trim()).filter(Boolean).forEach(link => {
            const safe = esc(link);
            if (link.startsWith('http')) rows.push(`<li><a href="${safe}" target="_blank" rel="noopener">${safe}<span>↗</span></a></li>`);
            else rows.push(`<li><span>${safe}</span></li>`);
        });
    }
    if (!rows.length) return '';
    return `
        <div class="final-block">
            <div class="block-label">Полезные материалы</div>
            <ul class="materials">${rows.join('')}</ul>
        </div>
    `;
}

function selectAnswer(toNodeId, label) {
    if (currentNode) {
        history.push({
            nodeId: currentNode.id,
            title: currentNode.title || 'Шаг',
            answer: label || 'Далее'
        });
    }
    loadNode(toNodeId);
}

document.addEventListener('click', (event) => {
    const btn = event.target.closest('.scenario-next');
    if (!btn) return;
    const nodeId = Number(btn.dataset.nid);
    if (!nodeId) return;
    selectAnswer(nodeId, btn.dataset.label || 'Далее');
});

function goBack() {
    if (!history.length) return;
    const prev = history.pop();
    loadNode(prev.nodeId);
}

function updatePath() {
    const root = document.getElementById('pathList');
    if (!history.length) {
        root.innerHTML = '<div class="path-empty">Ответы появятся здесь после выбора вариантов в сценарии.</div>';
        return;
    }
    root.innerHTML = history.map(item => `
        <div class="path-item">
            <div class="path-dot"></div>
            <div>
                <div class="path-question">${esc(item.title)}</div>
                <div class="path-answer">${esc(item.answer)}</div>
            </div>
        </div>
    `).join('');
}

function updateProgress() {
    const step = Math.max(1, history.length + 1);
    const pct = Math.min(100, Math.round((step / TOTAL_NODES) * 100));
    document.getElementById('stepText').textContent = `Шаг ${step} из ${TOTAL_NODES}`;
    document.getElementById('progressBar').style.width = pct + '%';
}

function copyAnswer() {
    const el = document.getElementById('finalAnswerText');
    const btn = document.getElementById('copyBtn');
    if (!el) return;
    navigator.clipboard.writeText(el.innerText).then(() => {
        if (!btn) return;
        btn.textContent = 'Скопировано';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = 'Скопировать ответ';
            btn.classList.remove('copied');
        }, 2200);
    }).catch(() => {
        const range = document.createRange();
        range.selectNode(el);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
    });
}

function showLoading() {
    document.getElementById('content').innerHTML = '<div class="loading"><div><div class="spinner"></div>Загрузка сценария...</div></div>';
}

function showError(message) {
    document.getElementById('content').innerHTML = `
        <div class="empty">
            <div>
                <h2>Не удалось открыть сценарий</h2>
                <p>${esc(message)}</p>
                <a class="secondary-btn" href="{{ url_for('scenarios_list') }}">← К списку сценариев</a>
            </div>
        </div>
    `;
}

function showRestartModal() {
    document.getElementById('restartModal').classList.add('show');
}
function closeRestartModal() {
    document.getElementById('restartModal').classList.remove('show');
}
function confirmRestart() {
    history = [];
    currentNode = null;
    closeRestartModal();
    loadNode(ROOT_NODE_ID);
}

(function init() {
    if (!ROOT_NODE_ID) {
        showError('Сценарий не настроен: стартовый шаг не найден.');
        return;
    }
    loadNode(ROOT_NODE_ID);
})();
</script>
