<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр - В разработке</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0c0c0c;
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .maintenance {
            text-align: center;
            max-width: 520px;
            padding: 50px 40px;
            background: linear-gradient(180deg, #1a1a1a, #202020);
            border: 1px solid #242424;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: gear 4s linear infinite;
            display: inline-block;
        }
        @keyframes gear {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #fff;
        }
        .subtitle {
            font-size: 16px;
            color: #b5b5b5;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #242424;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .progress-fill {
            height: 100%;
            width: 60%;
            background: linear-gradient(90deg, #00a651, #00d46a);
            border-radius: 3px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; width: 40%; }
            50% { opacity: 1; width: 75%; }
        }
        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #00a651, #009448);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,166,81,0.25);
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,166,81,0.35);
        }
        .dots {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            overflow: hidden;
            pointer-events: none;
        }
        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0,166,81,0.15);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-30px) scale(1.5); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="maintenance">
        <div class="dots" id="dots"></div>
        <div class="icon">&#x2699;&#xFE0F;</div>
        <h1>Тренажёр в разработке</h1>
        <p class="subtitle">
            Мы работаем над улучшением тренажёра.<br>
            Скоро здесь появится обновлённая версия.
        </p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <a href="/" class="btn-back">&#x2190; На главную</a>
    </div>

    <script>
        var dotsContainer = document.getElementById('dots');
        for (var i = 0; i < 20; i++) {
            var dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.left = Math.random() * 100 + '%';
            dot.style.top = Math.random() * 100 + '%';
            dot.style.animationDelay = Math.random() * 6 + 's';
            dot.style.animationDuration = (4 + Math.random() * 4) + 's';
            dotsContainer.appendChild(dot);
        }
    </script>
</body>
</html>
