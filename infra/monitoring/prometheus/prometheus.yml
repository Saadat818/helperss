global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: prometheus
          env: prod

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          service: server
          env: prod

  - job_name: helper
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:5003"]
        labels:
          service: helper
          env: prod

