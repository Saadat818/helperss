    let timerInterval = null, timeLeft = 0;

    function fmtTime(s) {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return '⏱ ' + m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function updateTimerDisplay() {
        const el = document.getElementById('flowTimer');
        el.textContent = fmtTime(timeLeft);
        el.className = 'flow-timer';
        if (timeLeft <= 0)       el.classList.add('expired');
        else if (timeLeft <= 10) el.classList.add('danger');
        else if (timeLeft <= 20) el.classList.add('warning');
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = TIME_LIMITS[size] || 120;
        updateTimerDisplay();
        timerInterval = setInterval(function() {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                const st = document.getElementById('flowStatus');
                st.textContent = '⏰ Время вышло! Попробуй ещё раз';
                st.className = 'flow-status';
                st.style.color = '#e74c3c';
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    function cellSize() { return Math.floor(CELL / size); }

    function initLevel(idx) {
        curLevel = idx;
        localStorage.setItem('flowLevel', idx);
        const lv = LEVELS[idx];
        size = lv.s;
        dots = lv.d;
        grid = Array.from({length:size}, () => Array(size).fill(null));
        paths = dots.map(() => []);
        drawing = false; drawColor = -1; lastCell = null;
        // Ставим точки
        dots.forEach((d,i) => {
            grid[d[0]][d[1]] = {color:i, isEnd:false};
            grid[d[2]][d[3]] = {color:i, isEnd:true};
        });
        document.getElementById('flowLvlBadge').textContent = 'Уровень '+(idx+1);
        const pct = Math.round((idx+1)/LEVELS.length*100);
        document.getElementById('flowProgressFill').style.width = pct+'%';
        const st = document.getElementById('flowStatus');
        st.textContent = 'Соедини все пары точек';
        st.className = 'flow-status';
        st.style.color = '';
        document.getElementById('flowResetAllBtn').style.display = 'none';
        draw();
        startTimer();
    }

    function draw() {
        const cv = document.getElementById('flowCanvas');
        const ctx = cv.getContext('2d');
        const cs = cellSize();
        ctx.clearRect(0,0,CELL,CELL);
        // Сетка
        ctx.strokeStyle = '#2a3a4a';
        ctx.lineWidth = 1;
        for(let r=0;r<=size;r++){
            ctx.beginPath(); ctx.moveTo(0,r*cs); ctx.lineTo(size*cs,r*cs); ctx.stroke();
        }
        for(let c=0;c<=size;c++){
            ctx.beginPath(); ctx.moveTo(c*cs,0); ctx.lineTo(c*cs,size*cs); ctx.stroke();
        }
        // Пути
        paths.forEach((path,ci) => {
            if(path.length<2) return;
            ctx.strokeStyle = COLORS[ci % COLORS.length];
            ctx.lineWidth = cs*0.38;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0][1]*cs+cs/2, path[0][0]*cs+cs/2);
            for(let i=1;i<path.length;i++){
                ctx.lineTo(path[i][1]*cs+cs/2, path[i][0]*cs+cs/2);
            }
            ctx.stroke();
        });
        // Точки
        dots.forEach((d,ci) => {
            [[d[0],d[1]],[d[2],d[3]]].forEach(([r,c]) => {
                ctx.beginPath();
                ctx.arc(c*cs+cs/2, r*cs+cs/2, cs*0.32, 0, Math.PI*2);
                ctx.fillStyle = COLORS[ci % COLORS.length];
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = cs*0.06;
                ctx.stroke();
            });
        });
    }

    function cellFromEvent(e) {
        const cv = document.getElementById('flowCanvas');
        const rect = cv.getBoundingClientRect();
        const cs = cellSize();
        let x, y;
        if(e.touches) {
            x = e.touches[0].clientX - rect.left;
            y = e.touches[0].clientY - rect.top;
        } else {
            x = e.clientX - rect.left;
            y = e.clientY - rect.top;
        }
        return [Math.floor(y/cs), Math.floor(x/cs)];
    }

    function colorOfDot(r,c) {
        for(let i=0;i<dots.length;i++){
            if((dots[i][0]===r&&dots[i][1]===c)||(dots[i][2]===r&&dots[i][3]===c)) return i;
        }
        return -1;
    }

    function startDraw(e) {
        e.preventDefault();
        const [r,c] = cellFromEvent(e);
        if(r<0||r>=size||c<0||c>=size) return;
        const ci = colorOfDot(r,c);
        if(ci < 0) return;
        // Очищаем старый путь этого цвета
        paths[ci] = [[r,c]];
        // Очищаем клетки пути из сетки
        for(let rr=0;rr<size;rr++) for(let cc=0;cc<size;cc++){
            if(grid[rr][cc]&&grid[rr][cc].path===ci) grid[rr][cc]=null;
        }
        // Восстанавливаем точки
        dots.forEach((d,i) => {
            grid[d[0]][d[1]] = {color:i, isEnd:false};
            grid[d[2]][d[3]] = {color:i, isEnd:true};
        });
        drawing = true; drawColor = ci; lastCell = [r,c];
        draw();
    }

    function moveDraw(e) {
        if(!drawing) return;
        e.preventDefault();
        const [r,c] = cellFromEvent(e);
        if(r<0||r>=size||c<0||c>=size) return;
        const last = lastCell;
        if(r===last[0]&&c===last[1]) return;
        // Только соседние клетки
        if(Math.abs(r-last[0])+Math.abs(c-last[1]) !== 1) return;
        // Нельзя на чужую точку
        const ci2 = colorOfDot(r,c);
        if(ci2 >= 0 && ci2 !== drawColor) return;
        // Нельзя на чужой путь
        if(grid[r][c]&&grid[r][c].path !== undefined && grid[r][c].path !== drawColor) return;
        // Если возврат — обрезаем
        const pathArr = paths[drawColor];
        const backIdx = pathArr.findIndex(p=>p[0]===r&&p[1]===c);
        if(backIdx >= 0) {
            // Очищаем обрезанные клетки
            for(let i=backIdx+1;i<pathArr.length;i++){
                const [pr,pc] = pathArr[i];
                if(!colorOfDot(pr,pc) && colorOfDot(pr,pc)!==0) grid[pr][pc]=null;
                if(colorOfDot(pr,pc)<0) grid[pr][pc]=null;
            }
            paths[drawColor] = pathArr.slice(0,backIdx+1);
            lastCell = [r,c];
            draw(); return;
        }
        paths[drawColor].push([r,c]);
        if(colorOfDot(r,c)<0) grid[r][c] = {path: drawColor};
        lastCell = [r,c];
        draw();
    }

    function endDraw(e) {
        drawing = false;
        checkWin();
    }

    function checkWin() {
        // Все пути замкнуты (начало и конец соответствуют точкам)
        const allConnected = dots.every((d,i) => {
            const p = paths[i];
            if(p.length < 2) return false;
            const s = p[0], en = p[p.length-1];
            return ((s[0]===d[0]&&s[1]===d[1]&&en[0]===d[2]&&en[1]===d[3])||
                    (s[0]===d[2]&&s[1]===d[3]&&en[0]===d[0]&&en[1]===d[1]));
        });
        // Все клетки заполнены
        let filled = 0;
        paths.forEach(p => filled += p.length);
        const allFilled = filled >= size*size;
        if(allConnected && allFilled) {
            stopTimer();
            const st = document.getElementById('flowStatus');
            st.textContent = '🎉 Уровень пройден!';
            st.className = 'flow-status win';
            st.style.color = '';
            document.getElementById('flowTimer').className = 'flow-timer';
            setTimeout(() => {
                if(curLevel < LEVELS.length-1) {
                    initLevel(curLevel+1);
                    const widget = document.getElementById('flowWidget');
                    if (widget && !widget.classList.contains('open')) stopTimer();
                } else {
                    document.getElementById('flowStatus').textContent = '🏆 Все 100 уровней пройдены!';
                    document.getElementById('flowResetAllBtn').style.display = 'inline-block';
                }
            }, 900);
        }
    }

    function flowHint() {
        // Подсвечиваем не соединённые цвета
        const unconnected = dots.map((_,i)=>i).filter(i => paths[i].length < 2);
        if(unconnected.length === 0) return;
        const hi = unconnected[0];
        const cv = document.getElementById('flowCanvas');
        const ctx = cv.getContext('2d');
        const cs = cellSize();
        const d = dots[hi];
        ctx.beginPath();
        ctx.arc(d[1]*cs+cs/2, d[0]*cs+cs/2, cs*0.45, 0, Math.PI*2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(d[3]*cs+cs/2, d[2]*cs+cs/2, cs*0.45, 0, Math.PI*2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    function resumeTimer() {
        if (timeLeft <= 0 || timerInterval) return;
        timerInterval = setInterval(function() {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                const st = document.getElementById('flowStatus');
                st.textContent = '⏰ Время вышло! Попробуй ещё раз';
                st.className = 'flow-status';
                st.style.color = '#e74c3c';
            }
        }, 1000);
    }

    function setFlowOpen(open) {
        const widget = document.getElementById('flowWidget');
        const isOpen = widget.classList.contains('open');
        if (open === isOpen) return;
        widget.classList.toggle('open', open);
        if (!open) {
            // Закрываем — замораживаем таймер
            clearInterval(timerInterval);
            timerInterval = null;
        } else {
            // Открываем — возобновляем таймер если время ещё есть
            resumeTimer();
        }
    }

    window.toggleFlow = function(event) {
        if (event) event.stopPropagation();
        const widget = document.getElementById('flowWidget');
        setFlowOpen(!widget.classList.contains('open'));
    };

    window.closeFlow = function(event) {
        if (event) event.stopPropagation();
        setFlowOpen(false);
    };

    window.flowNextLevel = function() {
        if(curLevel < LEVELS.length-1) initLevel(curLevel+1);
    };
    window.flowPrevLevel = function() {
        if(curLevel > 0) initLevel(curLevel-1);
    };
    window.flowRestart = function() { initLevel(curLevel); };
    window.flowHint = flowHint;
    window.flowResetAll = function() {
        if(!confirm('Сбросить прогресс и начать с первого уровня?')) return;
        localStorage.setItem('flowLevel', '0');
        document.getElementById('flowResetAllBtn').style.display = 'none';
        initLevel(0);
    };

    document.addEventListener('DOMContentLoaded', function() {
        const cv = document.getElementById('flowCanvas');
        cv.addEventListener('mousedown', startDraw);
        cv.addEventListener('mousemove', moveDraw);
        cv.addEventListener('mouseup', endDraw);
        cv.addEventListener('touchstart', startDraw, {passive:false});
        cv.addEventListener('touchmove', moveDraw, {passive:false});
        cv.addEventListener('touchend', endDraw);
        initLevel(curLevel);
        stopTimer();
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') setFlowOpen(false);
        });
        document.addEventListener('click', function(event) {
            const widget = document.getElementById('flowWidget');
            if (widget && widget.classList.contains('open') && !widget.contains(event.target)) {
                setFlowOpen(false);
            }
        });
    });
    })();
    </script>
